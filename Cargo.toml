[workspace]
resolver = "3"
members = ["repostore", "repostore-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Vincent Hanquez"]
repository = "https://github.com/vincenthz/repostore"

[workspace.dependencies]
repostore = { path = "repostore", version = "0.1.0" }
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
dirs = "7.0.0"
futures = { version = "0.3.34", default-features = false, features = ["std"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
